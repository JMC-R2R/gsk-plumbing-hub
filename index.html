<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GSK Plumbing Solutions Content Hub | Ready to Rank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sans:'Archivo',system-ui,sans-serif; --mono:'Space Mono',monospace;
    --blue:#17B4F0; --accent:#266FE2;
    --ink-dk:#0F0F12; --ink:#1b1d22; --muted:#5f6671;
    --line:#e2e6ec; --soft:#f4f7fb; --soft-blue:#eaf7fe; --good:#1c7c54;
    --st-none:#c2c9d4; --st-start:#e8a33d; --st-work:#17B4F0; --st-almost:#7c5cd6; --st-done:#1c7c54;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:#fff;line-height:1.5;font-size:14px;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:0 22px}
  h1,h2,h3{font-family:var(--sans);letter-spacing:-.3px;margin:0}
  a{color:#0a6a93}
  .hide{display:none !important}
  .kicker{font-family:var(--mono);text-transform:uppercase;letter-spacing:3px;font-size:11px;
          font-weight:700;color:var(--blue);margin:0 0 12px}
  .micro{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}

  /* ---------- login ---------- */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--soft)}
  .loginbox{width:100%;max-width:390px;background:#fff;border:1px solid var(--line);
            border-radius:16px;padding:32px;box-shadow:0 10px 40px rgba(15,15,18,.07)}
  .loginbox h1{font-size:20px;font-weight:900;margin:18px 0 6px}
  .loginbox p.sub{margin:0 0 22px;color:var(--muted);font-size:13.5px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600}
  input[type=email],input[type=password]{width:100%;padding:11px 13px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;margin-bottom:14px;
    font-family:var(--sans)}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,180,240,.15)}
  .btn{font-family:var(--sans);font-size:13px;font-weight:800;padding:11px 20px;border-radius:8px;
       border:1px solid var(--blue);background:var(--blue);color:#06222e;cursor:pointer}
  .btn:hover{filter:brightness(1.05)} .btn[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--ink)}
  .btn.wide{width:100%}
  .err{color:#b3261e;font-size:13px;min-height:19px;margin-top:4px}

  /* ---------- co-brand ---------- */
  .lockup{display:flex;align-items:center;gap:14px}
  .lockup img.cl{height:30px;width:auto;display:block}
  .lockup .rule{width:1px;height:26px;background:rgba(255,255,255,.25)}
  .lockup img.r2r{height:22px;width:auto;display:block}
  .login .lockup .rule{background:var(--line)}

  /* ---------- header ---------- */
  header{background:var(--ink-dk);color:#fff}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 0}
  .whochip{font-family:var(--mono);font-size:11px;color:#9aa3b2}
  .whochip b{color:var(--blue)}
  .cover{padding:8px 0 26px}
  .cover h1{font-size:clamp(25px,3.6vw,38px);font-weight:900;color:#fff;margin:0 0 8px}
  .cover p.sub{margin:0;color:#c4ccd8;font-size:14.5px;max-width:760px}

  /* ---------- document cover (top of the Strategy tab) ----------
     Distinct from .cover above, which is the signed-in page header. */
  .doc-cover{background:var(--ink-dk);color:#fff;border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;gap:34px;
    padding:40px 44px;margin:0 0 26px;
    background-image:radial-gradient(circle at 82% 12%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 46%),
                     radial-gradient(circle at 0% 100%,rgba(57,160,254,.16),transparent 40%);}
  .dc-logos{display:flex;justify-content:space-between;align-items:center;gap:24px}
  .dc-logos img{max-height:50px;max-width:210px;object-fit:contain;display:block}
  .dc-logos .dc-wm{font-weight:900;font-size:18px;letter-spacing:.5px;color:#fff}
  .doc-cover .kicker{color:var(--accent);margin:0 0 12px}
  .doc-cover h1{font-size:clamp(28px,4.4vw,50px);font-weight:900;line-height:1.04;
    letter-spacing:-1px;color:#fff;margin:0 0 18px}
  .doc-cover h1 .hi{color:var(--accent)}
  .doc-cover p.dc-sub{font-size:16.5px;color:#c4ccd8;max-width:660px;margin:0;font-weight:400}
  .dc-meta{display:flex;gap:40px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.14);padding-top:20px}
  .dc-meta .m-lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;
    letter-spacing:1.5px;color:var(--accent);margin:0 0 5px}
  .dc-meta .m-val{font-size:14.5px;font-weight:700;color:#fff;margin:0;line-height:1.35}
  .dc-handle{font-family:var(--mono);font-size:12px;color:#8b94a3;margin:16px 0 0}
  .dc-handle b{color:var(--accent)}

  /* ---------- strategy document furniture ---------- */
  p.lead{font-size:15.5px;line-height:1.62;color:var(--ink);margin:14px 0 18px}
  .caption{font-size:12px;color:var(--muted);margin:8px 0 22px;line-height:1.5}
  tr.hl td{background:#e3f5ec !important;font-weight:700}
  tr.hl td .win{color:var(--good)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .power{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:10px;padding:14px 18px;margin:14px 0}
  .power h4{margin:0 0 6px;font-size:15px;font-weight:800}
  .pm-badge{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:1.2px;background:var(--ink-dk);color:var(--accent);
    padding:3px 9px;border-radius:20px;margin-bottom:8px}

  /* ---------- tabs ---------- */
  .tabsbar{background:var(--ink-dk);border-top:1px solid #23252c;position:sticky;top:0;z-index:30}
  .tabs{display:flex;overflow-x:auto}
  .tab-btn{appearance:none;border:0;border-bottom:3px solid transparent;background:transparent;
    color:#9aa3b2;font-family:var(--sans);font-weight:700;font-size:13px;padding:13px 16px;
    cursor:pointer;white-space:nowrap}
  .tab-btn:hover{color:#fff}
  .tab-btn.active{color:#fff;border-bottom-color:var(--accent)}
  .tab-btn .tn{font-family:var(--mono);font-size:10px;color:var(--blue);margin-right:6px}
  .tab-btn.active .tn{color:var(--accent)}
  .aud{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
       padding:1px 5px;border-radius:4px;margin-left:7px;border:1px solid #3a3d46;color:#7d8494}
  .aud.internal{border-color:#4a3f6b;color:#b79cf0}
  .aud.client{border-color:#1e4b5c;color:#5fd0f5}

  main{padding:26px 0 70px}
  .tab-panel{display:none} .tab-panel.active{display:block}

  /* ---------- numbered section head ---------- */
  .sec-head{display:flex;align-items:center;gap:14px;background:var(--ink-dk);color:#fff;
            padding:12px 18px;border-radius:10px;margin:0 0 18px}
  .sec-num{background:var(--accent);color:var(--ink-dk);width:30px;height:30px;border-radius:7px;
           display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex:none}
  .sec-head h2{font-weight:900;font-size:21px;color:#fff}
  p.intro{font-size:14.5px;color:var(--muted);margin:0 0 20px;max-width:820px}

  h3{font-weight:900;font-size:16.5px;color:var(--ink-dk);margin:26px 0 8px}
  h3.subhead{display:flex;align-items:baseline;gap:9px;border-bottom:2px solid var(--ink-dk);padding-bottom:6px}
  h3.subhead .sn{font-family:var(--mono);font-size:12px;color:var(--blue);font-weight:700}
  p{margin:0 0 11px} ul{margin:0 0 12px;padding-left:20px} li{margin-bottom:5px}
  .empty{color:var(--muted);font-style:italic}

  ul.spec{padding-left:0} ul.spec li{list-style:none;position:relative;padding-left:22px}
  ul.spec li::before{content:"\2713";position:absolute;left:0;color:var(--good);font-weight:900}

  .callout{background:var(--soft-blue);border-left:4px solid var(--blue);padding:12px 16px;
           border-radius:0 8px 8px 0;margin:14px 0}
  .answer{background:#eef7ee;border-left:4px solid var(--good);padding:12px 16px;
          border-radius:0 8px 8px 0;margin:14px 0}
  .internal-note{background:#f6f3ff;border-left:4px solid #7c5cd6;padding:11px 16px;
                 border-radius:0 8px 8px 0;margin:14px 0}
  .internal-note .micro{color:#6a4fc0} .internal-note p{margin:5px 0 0;font-size:13.3px}

  .statrow{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 20px}
  .stat{background:var(--ink-dk);border-radius:12px;padding:16px 20px;color:#fff;min-width:150px;flex:1 1 150px;
        background-image:radial-gradient(circle at 90% 0%,rgba(23,180,240,.28),transparent 60%)}
  .stat .big{font-size:30px;font-weight:900;color:var(--accent);line-height:1}
  .stat .lbl{font-size:12px;color:#c4ccd8;margin-top:7px}

  /* ---------- tables ---------- */
  .scroll{overflow-x:auto}
  table.mini{width:100%;border-collapse:collapse;margin:10px 0 20px;font-size:12.6px}
  table.mini th{background:var(--ink-dk);color:#fff;text-align:left;padding:8px 10px;
    font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  table.mini td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.mini tr:nth-child(even) td{background:var(--soft)}
  table.mini td.num{text-align:right;white-space:nowrap}
  table.mini td.asset{font-weight:700;color:var(--ink-dk);min-width:170px}
  table.mini td.kwc{font-family:var(--mono);font-size:11.5px;color:#0a6a93}
  table.mini td.note{color:var(--muted);font-size:11.8px}
  .kwtable{min-width:840px}
  b.vol{font-family:var(--mono);font-size:12.5px;color:var(--ink-dk)}
  .novol{font-family:var(--mono);font-size:10.5px;color:#9aa3b2}

  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;
        white-space:nowrap;font-family:var(--mono)}
  .pill-kd-low{background:#e3f5ec;color:var(--good)}
  .pill-kd-mid{background:#fff3da;color:#a96a00}
  .pill-kd-hi{background:#fde3e3;color:#b3261e}
  .pill-kd-na{background:#eef1f6;color:#9aa3b2}
  .badge{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.4px;
         text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap}
  .b-loc{background:var(--soft-blue);color:#0a6a93}
  .b-blog{background:#eef7ee;color:var(--good)}
  .b-svc{background:#eaf3ff;color:#1663b8}
  .b-gmb{background:#fff3da;color:#a96a00}
  .b-power{background:#fff8e1;color:#8a6d00}
  .b-soc{background:#f6f3ff;color:#6a4fc0}

  /* ---------- calendar ---------- */
  .monthgroup{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0}
  .mg-head{background:var(--ink-dk);color:#fff;padding:11px 18px;display:flex;align-items:center;
           justify-content:space-between;gap:14px;flex-wrap:wrap}
  .mg-head .mt{font-weight:900;font-size:15.5px}
  .mg-head .mm{font-family:var(--mono);font-size:10.5px;color:#9aa3b2;font-weight:700}
  .mg-bar{height:7px;background:#e6eaf0}
  .mg-bar>i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
  .rag{font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;
       letter-spacing:.5px;padding:3px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px}
  .rag i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
  .rag.red{background:#fdeaea;color:#b3261e}
  .rag.amber{background:#fff5e3;color:#8a5a00}
  .rag.green{background:#e8f4ee;color:var(--good)}
  .caltable{min-width:900px}
  .caltable td.date{font-family:var(--mono);font-size:11px;white-space:nowrap;color:var(--muted)}
  .caltable td.title{font-weight:600;color:var(--ink-dk);min-width:260px}
  .stage{font-family:var(--mono);font-size:9px;letter-spacing:.5px;padding:2px 6px;border-radius:4px;
         margin-left:7px;border:1px solid var(--line);color:var(--muted)}
  .stage.TOFU{background:#eaf7fe;border-color:#bfe6f8;color:#0a6a93}
  .stage.MOFU{background:#fff3da;border-color:#f0dcb2;color:#a96a00}
  .stage.BOFU{background:#e3f5ec;border-color:#bfe3d1;color:var(--good)}
  .sp{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.4px;
      text-transform:uppercase;padding:3px 9px;border-radius:99px}
  .sp.started{background:#eef1f6;color:#5f6671}
  .sp.for_approval{background:#fff3da;color:#a96a00}
  .sp.approved{background:#e3f5ec;color:var(--good)}
  .sp.scheduled{background:#eaf3ff;color:#1663b8}
  .sp.live{background:#e8f4ee;color:var(--good)}
  tr.typerow td{background:#eef1f6 !important;padding:7px 10px;border-bottom:1px solid var(--line)}
  tr.typerow .tc{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:10px;
                 letter-spacing:.5px;text-transform:uppercase}
  .pos{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:700;
       padding:2px 9px;border-radius:20px;min-width:34px;text-align:center}
  .pos.top3{background:#e3f5ec;color:var(--good)}
  .pos.p1{background:#eaf7fe;color:#0a6a93}
  .pos.p2{background:#fff3da;color:#a96a00}
  .pos.deep{background:#fdeaea;color:#b3261e}
  .pos.none{background:#eef1f6;color:#9aa3b2;font-size:10px;font-weight:400}
  .mv{font-family:var(--mono);font-size:9.5px;font-weight:700;margin-left:6px}
  .mv.up{color:var(--good)} .mv.down{color:#b3261e}
  .tick{width:18px;height:18px;accent-color:var(--good);cursor:pointer}
  .tick:disabled{cursor:not-allowed;opacity:.35}
  select,textarea{font-family:var(--sans);background:#fff;color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:6px 9px;font-size:12.5px}
  select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea.note{width:100%;min-height:62px;resize:vertical;font-size:13px}
  .notebtn{background:transparent;border:1px solid var(--line);border-radius:16px;padding:3px 10px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--muted);cursor:pointer}
  .notebtn:hover{border-color:var(--accent);color:var(--ink-dk)}
  .notedot{width:6px;height:6px;border-radius:50%;background:#e8a33d;display:inline-block;margin-left:5px}
  tr.noterow td{background:var(--soft);padding:0}
  .notewrap{padding:13px 16px;max-width:820px}
  .savebadge{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .savebadge.ok{color:var(--good)} .savebadge.err{color:#b3261e}

  /* deliverable links: the Google Doc holding the draft, and the published page */
  td.lnk{text-align:center;white-space:nowrap}
  .dl{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.4px;
      text-transform:uppercase;padding:3px 10px;border-radius:99px;text-decoration:none;
      background:#eaf7fe;color:#0a6a93;border:1px solid #bfe6f8}
  .dl:hover{background:#d8f0fc}
  .dl.live{background:#e3f5ec;color:var(--good);border-color:#bfe3d1}
  .dl.live:hover{background:#d2eede}
  .dl-none{color:#c4cad4}
  .linkwrap{padding:13px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:980px}
  .linkwrap label{font-family:var(--mono);font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;
                  color:var(--muted)}
  input.lin{font-family:var(--sans);background:#fff;color:var(--ink);border:1px solid var(--line);
            border-radius:7px;padding:7px 10px;font-size:12.5px;min-width:280px;flex:1}
  input.lin:focus{outline:none;border-color:var(--accent)}
  .brief{flex-basis:100%;margin-top:4px;padding:11px 13px;background:#fff;border:1px solid var(--line);
         border-radius:8px;font-size:12.5px;line-height:1.55}
  .brief b{font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;
           color:var(--muted);display:block;margin-bottom:5px}
  /* the row a client lands on from an approval email */
  tr.flash td{animation:flash 2.2s ease-out}
  @keyframes flash{0%,55%{background:#fff6dd}100%{background:transparent}}

  footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:12px;background:var(--soft)}
  .foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  @media print{ .tabsbar,.notebtn,.btn{display:none} .tab-panel{display:block !important}
                section,table,.stat,.monthgroup{page-break-inside:avoid} body{font-size:11.5px} }
  /* MUST stay `screen and` -- a bare max-width query also matches Chrome's print
     rendering, which collapses the layout in the saved PDF. */
  @media screen and (max-width:640px){ .cover h1{font-size:23px} .stat{min-width:130px} }
</style>
</head>
<body>

rties. Every visit we can measure is coming from the pack.</p>\n<div class=\"scroll\"><table class=\"mini\"><thead><tr><th>Keyword</th><th class=\"num\">Vol</th><th class=\"num\">Map pack</th><th class=\"num\">Organic</th><th class=\"num\">Est. visits</th></tr></thead><tbody><tr><td>plumber hurstville</td><td class=\"num\">320</td><td class=\"num\">1</td><td class=\"num\">31</td><td class=\"num\">8</td></tr><tr><td>plumbing hurstville</td><td class=\"num\">320</td><td class=\"num\">1</td><td class=\"num\">35</td><td class=\"num\">11</td></tr><tr><td>plumbers in hurstville</td><td class=\"num\">320</td><td class=\"num\">1</td><td class=\"num\">\u2014</td><td class=\"num\">14</td></tr><tr><td>hurstville plumber</td><td class=\"num\">320</td><td class=\"num\">1</td><td class=\"num\">33</td><td class=\"num\">7</td></tr><tr><td>emergency plumber hurstville</td><td class=\"num\">110</td><td class=\"num\">\u2014</td><td class=\"num\">34</td><td class=\"num\">0</td></tr></tbody></table></div>\n<p class=\"caption\">Your profile is genuinely well run. The job is not to get found in Hurstville \u2014 you already are. It is to make the result underneath the map worth something.</p>\n<h3>1.2 Your old site is outranking your new one</h3>\n<p>Your previous website is still live on a separate address and still indexed. It holds the entire blocked-toilet group \u2014 the strongest cluster you own \u2014 and it is beating the new site on every one of those searches.</p>\n<div class=\"scroll\"><table class=\"mini\"><thead><tr><th>Keyword</th><th class=\"num\">Vol</th><th>KD</th><th class=\"num\">Position</th><th>Which site</th></tr></thead><tbody><tr><td>blocked toilet plumber</td><td class=\"num\">590</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 5</span></td><td class=\"num\">37</td><td>Old site</td></tr><tr><td>plumber blocked toilet</td><td class=\"num\">390</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 7</span></td><td class=\"num\">28</td><td>Old site</td></tr><tr><td>plumber for clogged toilet</td><td class=\"num\">320</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 6</span></td><td class=\"num\">46</td><td>Old site</td></tr><tr><td>plumber for toilet blockage</td><td class=\"num\">70</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 6</span></td><td class=\"num\">17</td><td>Old site</td></tr><tr><td>plumber to unblock toilet</td><td class=\"num\">30</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 7</span></td><td class=\"num\">19</td><td>Old site</td></tr><tr><td>blocked toilet sydney</td><td class=\"num\">50</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 11</span></td><td class=\"num\">56</td><td>New site</td></tr></tbody></table></div>\n<p class=\"caption\">Two of your own pages are competing for the same customer and the older one is winning. Redirecting the old address onto the new site is the single highest-value technical fix available \u2014 and it needs access we do not have yet.</p>\n<h3>1.3 Where your rankings actually sit</h3>\n<p>Across the 53 keywords in this plan, here is where the website currently lands. Positions 11 to 30 are the quick-win pool \u2014 Google already rates those pages, they are just short of where the clicks happen.</p>\n<div class=\"scroll\"><table class=\"mini\"><thead><tr><th>Position</th><th>Where</th><th class=\"num\">Keywords</th><th>Reality</th></tr></thead><tbody><tr><td>1\u201310</td><td>Page 1</td><td class=\"num\">0</td><td>Nothing yet</td></tr><tr class=\"hl\"><td>11\u201330</td><td>Page 2\u20133</td><td class=\"num\">3</td><td>Striking distance \u2014 the quick-win pool</td></tr><tr><td>31\u201350</td><td>Page 4\u20135</td><td class=\"num\">7</td><td>Needs content and authority</td></tr><tr><td>51+</td><td>Deeper</td><td class=\"num\">7</td><td>Longer-term targets</td></tr><tr><td>\u2014</td><td>Not ranking</td><td class=\"num\">36</td><td>New pages to build</td></tr></tbody></table></div>\n<p class=\"caption\">You have no Search Console and no Analytics access, so there is no traffic history to show here \u2014 that access is being chased and this section grows once we have it.</p>\n<h3>1.4 Quick wins \u2014 page 2\u20133 to page 1</h3>\n<p>Three existing rankings sit within reach at low difficulty. All three are on the old address, so they land the moment the redirect is done.</p>\n<div class=\"scroll\"><table class=\"mini\"><thead><tr><th>Keyword</th><th class=\"num\">Vol</th><th class=\"num\">Pos.</th><th>KD</th><th>The move</th></tr></thead><tbody><tr><td>plumber for toilet blockage</td><td class=\"num\">70</td><td class=\"num\">17</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 6</span></td><td>Redirect, then one on-page pass</td></tr><tr><td>plumber to unblock toilet</td><td class=\"num\">30</td><td class=\"num\">19</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 7</span></td><td>Redirect \u2014 easiest win you own</td></tr><tr><td>plumber blocked toilet</td><td class=\"num\">390</td><td class=\"num\">28</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 7</span></td><td>Consolidate into one blocked toilets page</td></tr></tbody></table></div>\n<p class=\"caption\">Small volumes on their own, but they prove the cluster works \u2014 and the 590-a-month terms sit directly behind them.</p>\n<div class=\"sec-head\"><div class=\"sec-num\">2</div><h2>The plan at a glance</h2></div>\n<p class=\"lead\">We publish 10 pages every month \u2014 a deliberate mix of service pages, location pages and blogs written to be quoted in AI answers \u2014 plus 3 Google Business Profile posts a month to keep the map pack warm. We work one pillar at a time so each month builds real authority instead of scattering it.</p>\n<div class=\"statrow\"><div class=\"stat\"><div class=\"big\">10</div><div class=\"lbl\">Content pages every month \u2014 30 across the quarter</div></div><div class=\"stat\"><div class=\"big\">3</div><div class=\"lbl\">Google Business Profile posts every month \u2014 9 across the quarter</div></div><div class=\"stat\"><div class=\"big\">39</div><div class=\"lbl\">Total deliverables planned, September to November</div></div></div>\n<div class=\"callout\">Strategic read: your money is in the urgent jobs \u2014 blocked drains, blocked toilets and hot water \u2014 and that is where we start, because those are the searches someone makes with a problem in front of them right now. Locations follow, because a service page that ranks everywhere beats a suburb page that ranks nowhere.</div>\n<h3>Pillar sequence</h3>\n<div class=\"scroll\"><table class=\"mini\"><thead><tr><th>Phase</th><th>Pillar</th><th>Pages</th><th>Why now</th></tr></thead><tbody><tr><td>1 \u00b7 September</td><td>Blocked drains &amp; toilets</td><td>Service pages + the drain blog cluster</td><td>Your strongest cluster in Google and your number one money service.</td></tr><tr><td>2 \u00b7 October</td><td>Hot water</td><td>Repair, installation and the cost/lifespan blogs</td><td>Highest-volume service target you can realistically win (720/mo, KD 12).</td></tr><tr><td>3 \u00b7 November</td><td>Burst pipes, taps &amp; locations</td><td>Emergency pages + the St George suburb run</td><td>Rounds out the four services and puts the suburb pages behind proven pillars.</td></tr></tbody></table></div>\n<p class=\"caption\">Blogs and Google Business Profile posts run across every pillar each month, so the whole programme pulls in one direction.</p>\n<div class=\"sec-head\"><div class=\"sec-num\">3</div><h2>Keyword research</h2></div>\n<p class=\"caption\">All figures from SE Ranking, Australian database, pulled 12/08/2026. Vol = average monthly searches. KD = keyword difficulty, 0\u2013100, lower is easier.</p>\n<h3>3.1 Service pages \u2014 what we are going after</h3>\n<div class=\"scroll\"><table class=\"mini\"><thead><tr><th>Target</th><th class=\"num\">Vol</th><th>KD</th><th>Note</th></tr></thead><tbody><tr><td>hot water system repair</td><td class=\"num\">720</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 12</span></td><td>Best service target in the whole set</td></tr><tr><td>cctv drain inspection</td><td class=\"num\">590</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 7</span></td><td>Low difficulty, high value job</td></tr><tr><td>pipe relining sydney</td><td class=\"num\">480</td><td class=\"num\"><span class=\"pill pill-kd-mid\">KD 22</span></td><td>Start local \u2014 the national term is out of reach</td></tr><tr><td>burst pipe repair</td><td class=\"num\">320</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 5</span></td><td>Easiest service win available</td></tr><tr><td>blocked drain repair</td><td class=\"num\">320</td><td class=\"num\"><span class=\"pill pill-kd-mid\">KD 17</span></td><td>The winnable form of 'blocked drains'</td></tr><tr><td>hot water system installation</td><td class=\"num\">260</td><td class=\"num\"><span class=\"pill pill-kd-mid\">KD 23</span></td><td>Pairs with the repair page</td></tr><tr><td>drain jetting</td><td class=\"num\">110</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 4</span></td><td>Very low difficulty</td></tr><tr><td>24 hour plumber sydney</td><td class=\"num\">110</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 11</span></td><td>Emergency intent</td></tr></tbody></table></div>\n<p class=\"caption\">Deliberately not targeted: hot water system (18,100, KD 94), emergency plumber (5,400, KD 37) and blocked drains (1,900, KD 55). Out of reach from a standing start on a six-month plan \u2014 we will earn them later.</p>\n<h3>3.2 Suburbs \u2014 ranked by measured demand, not by radius</h3>\n<p>We measured every suburb inside your 15km. These are the ones that carry real demand, with your St George core first and the higher-volume outer suburbs after it.</p>\n<div class=\"scroll\"><table class=\"mini\"><thead><tr><th>Suburb term</th><th class=\"num\">Vol</th><th>KD</th><th>Area</th></tr></thead><tbody><tr><td>plumber hurstville</td><td class=\"num\">320</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 5</span></td><td>St George \u2014 home</td></tr><tr><td>plumber kogarah</td><td class=\"num\">140</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 8</span></td><td>St George</td></tr><tr><td>plumber carlton</td><td class=\"num\">140</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 9</span></td><td>St George</td></tr><tr><td>plumber kingsgrove</td><td class=\"num\">110</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 5</span></td><td>St George</td></tr><tr><td>plumber bexley</td><td class=\"num\">90</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 3</span></td><td>St George \u2014 your other real lead suburb</td></tr><tr><td>plumber rockdale</td><td class=\"num\">70</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 6</span></td><td>St George</td></tr><tr><td>plumber burwood</td><td class=\"num\">390</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 7</span></td><td>Wider radius</td></tr><tr><td>blocked drains burwood</td><td class=\"num\">170</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 5</span></td><td>Wider radius \u2014 best service-suburb term you have</td></tr><tr><td>plumber marrickville</td><td class=\"num\">390</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 14</span></td><td>Wider radius</td></tr><tr><td>plumber earlwood</td><td class=\"num\">110</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 5</span></td><td>Wider radius</td></tr></tbody></table></div>\n<p class=\"caption\">Burwood and Marrickville carry the most demand but sit at the edge of the radius and are a different market from St George. We need you to confirm how far you will actually travel before we commit pages to them.</p>\n<h3>3.3 Blog and Google post fuel</h3>\n<p>These are the questions people actually type. They bring in the customer earlier, and they are what AI answers quote.</p>\n<div class=\"scroll\"><table class=\"mini\"><thead><tr><th>Keyword</th><th class=\"num\">Vol</th><th>KD</th><th>Use</th></tr></thead><tbody><tr><td>how to fix a leaking tap</td><td class=\"num\">920</td><td class=\"num\"><span class=\"pill pill-kd-mid\">KD 16</span></td><td>Biggest single blog target you have</td></tr><tr><td>leaking tap</td><td class=\"num\">810</td><td class=\"num\"><span class=\"pill pill-kd-mid\">KD 15</span></td><td>Backs the tap service page</td></tr><tr><td>no hot water</td><td class=\"num\">720</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 11</span></td><td>Urgent \u2014 feeds hot water</td></tr><tr><td>blocked toilet</td><td class=\"num\">660</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 6</span></td><td>Feeds the toilet cluster</td></tr><tr><td>how to unblock a drain</td><td class=\"num\">590</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 11</span></td><td>Feeds blocked drains</td></tr><tr><td>burst pipe</td><td class=\"num\">590</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 11</span></td><td>Feeds burst pipe repair</td></tr><tr><td>how long do hot water systems last</td><td class=\"num\">480</td><td class=\"num\"><span class=\"pill pill-kd-mid\">KD 17</span></td><td>Research stage \u2014 AI answers love this one</td></tr><tr><td>gas vs electric hot water</td><td class=\"num\">480</td><td class=\"num\"><span class=\"pill pill-kd-mid\">KD 19</span></td><td>Comparison \u2014 high AI citation potential</td></tr><tr><td>blocked sink</td><td class=\"num\">320</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 10</span></td><td>Everyday problem, easy win</td></tr><tr><td>tree roots in drains</td><td class=\"num\">90</td><td class=\"num\"><span class=\"pill pill-kd-low\">KD 7</span></td><td>Explains the number one local cause</td></tr></tbody></table></div>\n<p class=\"caption\">A few of these show erratic month-to-month volume in the data. We have flagged them internally and will not build an argument on a number we do not trust.</p>\n<div class=\"sec-head\"><div class=\"sec-num\">4</div><h2>The plan, month on month</h2></div>\n<p class=\"lead\">Thirteen deliverables a month \u2014 10 pages and 3 Google Business Profile posts \u2014 for three months. Every item has its own brief, its own target keyword and its own tick box on the month tabs.</p>\n<div class=\"scroll\"><table class=\"mini\"><thead><tr><th>Month</th><th>Pillar</th><th class=\"num\">Pages</th><th class=\"num\">GBP posts</th><th class=\"num\">Total</th></tr></thead><tbody><tr><td>September 2026</td><td>Blocked drains &amp; toilets</td><td class=\"num\">10</td><td class=\"num\">3</td><td class=\"num\">13</td></tr><tr><td>October 2026</td><td>Hot water</td><td class=\"num\">10</td><td class=\"num\">3</td><td class=\"num\">13</td></tr><tr><td>November 2026</td><td>Burst pipes, taps &amp; locations</td><td class=\"num\">10</td><td class=\"num\">3</td><td class=\"num\">13</td></tr></tbody></table></div>\n<p class=\"caption\">Open the month tabs to see every title, the keyword behind it and the draft once it is written. You approve in two stages \u2014 first the topics, then the written content.</p>\n<div class=\"sec-head\"><div class=\"sec-num\">5</div><h2>Where you stand in AI search</h2></div>\n<p class=\"lead\">More and more plumbing questions now get answered inside ChatGPT, Gemini, Perplexity and Google's own AI overview, without the customer ever seeing a list of websites. We measured whether you appear in those answers today.</p>\n<div class=\"statrow\"><div class=\"stat\"><div class=\"big\">0 / 18</div><div class=\"lbl\">AI prompts you currently appear on</div></div><div class=\"stat\"><div class=\"big\">0</div><div class=\"lbl\">Links to your site recorded across AI engines</div></div><div class=\"stat\"><div class=\"big\">18</div><div class=\"lbl\">Real customer questions we are now tracking</div></div></div>\n<p>That is a clean zero, measured on 12/08/2026 \u2014 no brand mentions and no links to your site anywhere in AI results. It is not a failing; almost every plumber in your area is in the same position. It is the reason the AI Visibility plan exists, and it means every prompt we win is one nobody else has taken.</p>\n<p class=\"caption\">The full list of 18 prompts, and where you stand on each, is on the Keywords tab.</p>\n<div class=\"sec-head\"><div class=\"sec-num\">6</div><h2>How we win AI answers</h2></div>\n<div class=\"power\"><span class=\"pm-badge\">AI Visibility</span><h4>Content written to be quoted, not just ranked</h4><p>AI answers quote pages that state a clear fact, plainly, near the top. Every blog in this plan opens with a direct answer to the question in its title, then backs it with the detail \u2014 so it reads well for a customer and is easy for an AI to lift.</p></div>\n<div class=\"power\"><span class=\"pm-badge\">AI Visibility</span><h4>Questions, not just keywords</h4><p>The 18 prompts we track are phrased the way a person actually asks \u2014 'my hot water stopped working, who do I call' \u2014 not the way a keyword tool writes them. The content answers the question in that form.</p></div>\n<div class=\"power\"><span class=\"pm-badge\">AI Visibility</span><h4>Local proof the engines can verify</h4><p>AI answers lean heavily on Google Business Profile, reviews and consistent details across the web. Your profile is already strong, which is a genuine head start \u2014 the 3 posts a month keep feeding it.</p></div>\n<div class=\"sec-head\"><div class=\"sec-num\">7</div><h2>What we need from you</h2></div>\n<p class=\"lead\">Four things, and the first two are holding up real work.</p>\n<ul><li>Website access. The new site was built in Framer and handed over as a code repository, and the access link has expired. Until that is sorted we can write the pages but not publish them.</li><li>The old address. Someone else controls it. We need it pointed at the new site \u2014 that is what unlocks the quick wins in section 1.4.</li><li>Your suburbs, ranked. Section 3.2 has them ordered by demand. Tell us how far you genuinely travel and we will build the location pages in your order, not the data's.</li><li>The fifth service. You mentioned one on our call and we never got the name. Our best guess from the data is blocked toilets \u2014 it is your strongest cluster by a distance. Confirm and we will treat it properly.</li></ul>"}, {"key": "team-brief", "title": "Team Brief", "short": "Team Brief", "audience": "internal", "enabled": true, "intro": "Production rules for GSK. Read before writing anything.", "remote": true}, {"key": "months", "title": "Month Brief", "short": "Month Brief", "audience": "client", "enabled": true, "intro": "", "html": ""}, {"key": "keywords", "title": "Keywords", "short": "Keywords", "audience": "client", "enabled": true, "intro": "", "html": ""}, {"key": "progress", "title": "Progress", "short": "Progress", "audience": "internal", "enabled": true, "intro": "", "html": ""}]};
const sb = supabase.createClient(CFG.sbUrl, CFG.sbKey);

let ME = null, ITEMS = [], INTERNAL = {}, STAFF = [], TABDOCS = {},
    KEYWORDS = [], PROMPTS = [], CLIENT_ID = null, TABLIST = [];

const $  = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = (m,c='') => { const b=$('savebadge'); b.textContent=m; b.className='savebadge '+c;
                            if(c==='ok') setTimeout(()=>{ if(b.textContent===m) b.textContent=''; },2600); };

const CLIENT_STATUS = {started:'Started', for_approval:'For approval', approved:'Approved',
                       scheduled:'Scheduled', live:'Live'};
const INTERNAL_STATUS = [['not_started','Not started'],['started','Started'],['working','Working'],
                         ['almost_done','Almost done'],['done','Done']];
const TYPE_BADGE = {blog:'b-blog', location_page:'b-loc', service_page:'b-svc', gbp:'b-gmb',
                    social:'b-soc', linkedin:'b-soc'};
const TYPE_LABEL = {blog:'Blog', location_page:'Location page', service_page:'Service page',
                    gbp:'GBP post', social:'Social', linkedin:'LinkedIn'};
const STREAM_ORDER = ['blog','service_page','location_page','gbp','social','linkedin'];
const PROMPT_LABEL = {dark:'Not showing', partial:'Partial', visible:'Showing'};

const fmtDate = iso => { const [y,m,d]=iso.split('-').map(Number);
  return d+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]; };
const monthLabel = key => { const [y,m]=key.split('-').map(Number);
  return ['January','February','March','April','May','June','July','August','September','October','November','December'][m-1]+' '+y; };
const kdPill = kd => { if(kd===null||kd===undefined) return '<span class="pill pill-kd-na">—</span>';
  const c = kd<15?'low':(kd<=30?'mid':'hi'); return '<span class="pill pill-kd-'+c+'">KD '+kd+'</span>'; };
const volCell = v => v===null||v===undefined
  ? '<span class="novol">no data</span>' : '<b class="vol">'+esc(v)+'</b>';

/* ---------------- auth ---------------- */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('loginErr').textContent=''; $('loginBtn').disabled=true;
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('pw').value });
  $('loginBtn').disabled=false;
  if (error) { $('loginErr').textContent = 'Email or password not recognised.'; return; }
  boot();
});
$('logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { $('loginView').classList.remove('hide'); $('appView').classList.add('hide'); return; }

  const { data: clientRow } = await sb.from('ch_client_users')
    .select('client_id, full_name').eq('user_id', session.user.id).eq('active', true).maybeSingle();

  if (clientRow) {
    ME = { kind:'client', name: clientRow.full_name, clientId: clientRow.client_id };
  } else {
    const { data: staffRow } = await sb.from('tt_people')
      .select('name, role_title').eq('id', session.user.id).eq('active', true).maybeSingle();
    if (!staffRow) {
      await sb.auth.signOut();
      $('loginView').classList.remove('hide'); $('appView').classList.add('hide');
      $('loginErr').textContent = 'That login has no access to this hub.';
      return;
    }
    ME = { kind:'internal', name: staffRow.name, clientId: null };
  }

  const { data: c } = await sb.from('tt_clients').select('id,name').eq('slug', CFG.slug).maybeSingle();
  if (!c) {
    $('loginErr').textContent = ME.kind==='client'
      ? 'This hub is not the one linked to your login.'
      : 'This client is not set up in the database yet.';
    await sb.auth.signOut();
    $('loginView').classList.remove('hide'); $('appView').classList.add('hide');
    return;
  }
  CLIENT_ID = c.id;

  $('loginView').classList.add('hide'); $('appView').classList.remove('hide');
  $('whoChip').innerHTML = esc(ME.name) + ' &middot; <b>' + (ME.kind==='internal'?'INTERNAL':'CLIENT') + '</b>';

  await loadData();
  buildTabs();
  openDeepLink();
}

async function loadData(){
  const [q, kw, pr] = await Promise.all([
    sb.from('ch_items').select('*')
      .eq('client_id', CLIENT_ID).order('publish_date', {ascending:true}).order('sort_order'),
    sb.from('ch_keywords').select('*').eq('client_id', CLIENT_ID).order('kw_group').order('sort_order'),
    sb.from('ch_prompts').select('*').eq('client_id', CLIENT_ID).order('sort_order')
  ]);
  ITEMS = q.data || []; KEYWORDS = kw.data || []; PROMPTS = pr.data || [];
  if (q.error) badge('Could not load the calendar.','err');

  if (ME.kind === 'internal') {
    const [ints, staff, docs] = await Promise.all([
      sb.from('ch_items_internal').select('*'),
      sb.from('tt_people').select('id,name').eq('active', true).order('name'),
      sb.from('ch_tab_content').select('tab_key, body_html').eq('client_id', CLIENT_ID)
    ]);
    INTERNAL = Object.fromEntries((ints.data||[]).map(r => [r.item_id, r]));
    STAFF = staff.data || [];
    TABDOCS = Object.fromEntries((docs.data||[]).map(r => [r.tab_key, r.body_html]));
  }
}

/* ---------------- tabs ---------------- */
/* Expand the "months" placeholder into one tab per month actually present in the
   data, drop tabs this login may not see, then number what is left. Numbering
   last is the point: a client sees 01..05 with no gaps. */
function expandTabs(){
  const months = [...new Set(ITEMS.map(r => r.month_key))].sort();
  const out = [];
  for (const t of CFG.tabs) {
    if (!t.enabled) continue;
    if (ME.kind !== 'internal' && t.audience === 'internal') continue;
    if (t.key !== 'months') { out.push(Object.assign({}, t)); continue; }
    if (!months.length) {
      out.push(Object.assign({}, t, {key:'month:none', monthKey:null,
                                     title:'Month 1 Brief', short:'Month 1'}));
      continue;
    }
    months.forEach((mk, i) => out.push(Object.assign({}, t, {
      key: 'month:'+mk, monthKey: mk,
      title: 'Month '+(i+1)+' Brief', short: 'Month '+(i+1)
    })));
  }
  out.forEach((t, i) => { t.num = String(i+1).padStart(2,'0'); });
  return out;
}

function buildTabs(){
  TABLIST = expandTabs();
  $('tabs').innerHTML = TABLIST.map((t,i) =>
    '<button class="tab-btn'+(i===0?' active':'')+'" data-key="'+esc(t.key)+'">'
    + '<span class="tn">'+esc(t.num)+'</span>' + esc(t.short)
    + (ME.kind==='internal' ? '<span class="aud '+t.audience+'">'
        + (t.audience==='internal'?'Int':(t.audience==='client'?'Client':'Both')) + '</span>' : '')
    + '</button>').join('');
  $('panels').innerHTML = TABLIST.map((t,i) =>
    '<section class="tab-panel'+(i===0?' active':'')+'" id="panel-'+cssId(t.key)+'"></section>').join('');
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab-btn'); if (b) selectTab(b.dataset.key);
  });
  TABLIST.forEach(renderPanel);
}

/* month keys carry a colon, which is legal in an id but awkward in a selector */
const cssId = key => key.replace(':','--');

function selectTab(key, scroll){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.key===key));
  document.querySelectorAll('.tab-panel').forEach(p =>
    p.classList.toggle('active', p.id === 'panel-'+cssId(key)));
  if (scroll !== false) window.scrollTo({top:0,behavior:'smooth'});
}

/* The month a client is being asked to act on: the earliest with anything
   waiting on them, else the earliest that isn't fully approved, else the last. */
function actionMonth(){
  const withItems = TABLIST.filter(t => t.monthKey);
  const waiting = withItems.find(t =>
    ITEMS.some(r => r.month_key === t.monthKey && r.client_status === 'for_approval'));
  if (waiting) return waiting;
  const open = withItems.find(t =>
    ITEMS.some(r => r.month_key === t.monthKey && !r.approved));
  return open || withItems[withItems.length - 1] || null;
}

/* Deep link from an approval notification: /<slug>-hub/#<anchor> opens the right
   month tab, scrolls to that one deliverable and flashes it. */
function openDeepLink(){
  const want = decodeURIComponent((location.hash || '').replace(/^#/,''));
  if (!want) return;
  const it = ITEMS.find(r => r.anchor === want);
  if (!it) return;
  const t = TABLIST.find(x => x.monthKey === it.month_key);
  if (!t) return;
  selectTab(t.key, false);
  setTimeout(() => {
    const row = document.getElementById(want);
    if (!row) return;
    row.scrollIntoView({behavior:'smooth', block:'center'});
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 2400);
  }, 120);
}

function head(t){
  return '<div class="sec-head"><span class="sec-num">'+esc(t.num)+'</span><h2>'+esc(t.title)+'</h2></div>'
       + (t.intro ? '<p class="intro">'+esc(t.intro)+'</p>' : '');
}

function renderPanel(t){
  const el = $('panel-'+cssId(t.key));
  if (!el) return;
  if (t.monthKey !== undefined) { el.innerHTML = head(t)+monthBriefMarkup(t); wireMonthBrief(el,t); return; }
  if (t.key === 'keywords')     { el.innerHTML = head(t)+keywordsMarkup();                          return; }
  if (t.key === 'progress')     { el.innerHTML = head(t)+progressMarkup();   wireProgress(el);      return; }

  let body = (t.remote ? TABDOCS[t.key] : t.html) || '<p class="empty">Nothing here yet.</p>';
  const target = t.key === 'strategy' ? actionMonth() : null;
  if (target) {
    body += '<div class="callout"><b>Ready to approve?</b> Open this month\'s brief and tick the items '
          + 'you are happy for us to publish. <button class="btn" type="button" id="goApprove" '
          + 'style="margin-left:10px">Go to '+esc(target.title)+'</button></div>';
  }
  el.innerHTML = head(t) + body;
  const go = el.querySelector('#goApprove');
  if (go) go.addEventListener('click', () => selectTab(target.key));
}

/* ---------------- month briefs ---------------- */
/* One tab per month. Same rows the calendar used to show, but grouped under the
   month the client is actually being asked about, with the Google Doc and the
   live URL sitting on the row so nobody has to go hunting in Drive. */
function monthBriefMarkup(t){
  const rows = t.monthKey ? ITEMS.filter(r => r.month_key === t.monthKey) : [];
  if (!rows.length) return '<p class="empty">Nothing scheduled for this month yet.</p>';
  const staff = ME.kind === 'internal';

  const done    = rows.filter(r => r.approved).length;
  const pct     = Math.round(done / rows.length * 100);
  const waiting = rows.filter(r => r.client_status === 'for_approval').length;
  const rag     = done === rows.length ? 'green' : (waiting ? 'amber' : 'red');
  const ragTxt  = done === rows.length ? 'All approved'
                : (waiting ? waiting+' waiting on you' : 'In production');

  // Grouped by asset type rather than listed by date, so the client can see all
  // the blogs together, all the service pages together, and so on.
  let body = '';
  for (const stream of STREAM_ORDER) {
    const sr = rows.filter(r => r.stream === stream);
    if (!sr.length) continue;
    body += '<tr class="typerow"><td colspan="9">'
          + '<span class="badge '+(TYPE_BADGE[stream]||'b-blog')+'">'
          + esc(TYPE_LABEL[stream]||stream)+'</span>'
          + '<span class="tc">'+sr.length+' '+(sr.length===1?'item':'items')+'</span></td></tr>';
    for (const r of sr) body += itemRow(r, staff);
  }

  return '<div class="monthgroup"><div class="mg-head">'
       + '<span class="mt">'+esc(monthLabel(t.monthKey))+'</span>'
       + '<span class="rag '+rag+'"><i></i>'+ragTxt+'</span>'
       + '<span class="mm">'+done+' / '+rows.length+' approved</span></div>'
       + '<div class="mg-bar"><i style="width:'+pct+'%"></i></div>'
       + '<div class="scroll"><table class="mini caltable"><thead><tr>'
       + '<th>Deliverable</th><th>Primary keyword</th><th>Vol</th><th>KD</th>'
       + '<th>Secondary / note</th><th>Draft</th><th>Live</th><th>Status</th>'
       + '<th style="text-align:center">Approve</th>'
       + '</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

function itemRow(r, staff){
  const id = esc(r.id), st = esc(r.client_status), fs = esc(r.funnel_stage || '');
  const canTick = r.client_status !== 'started';
  const link = (url, cls, label) => url
    ? '<a class="dl '+cls+'" href="'+esc(url)+'" target="_blank" rel="noopener">'+label+'</a>'
    : '<span class="dl-none">—</span>';

  let out = '<tr class="itemrow" id="'+esc(r.anchor)+'" data-id="'+id+'">'
    + '<td class="title">'+esc(r.title)
      + (fs ? ' <span class="stage '+fs+'">'+fs+'</span>' : '')
      + '<div><button class="notebtn" type="button" data-note="'+id+'">Notes'
      + (r.client_notes ? '<span class="notedot"></span>' : '')+'</button>'
      + (staff ? ' <button class="notebtn" type="button" data-links="'+id+'">Links &amp; brief</button>' : '')
      + '</div></td>'
    + '<td class="kwc">'+esc(r.main_keyword||'—')+'</td>'
    + '<td class="num">'+volCell(r.search_volume)+'</td>'
    + '<td class="num">'+kdPill(r.difficulty)+'</td>'
    + '<td class="note">'+esc(r.secondary_note||'')+'</td>'
    + '<td class="lnk">'+link(r.doc_url, '', 'Draft')+'</td>'
    + '<td class="lnk">'+link(r.live_url, 'live', 'Live')+'</td>'
    + '<td><span class="sp '+st+'">'+esc(CLIENT_STATUS[r.client_status]||r.client_status)+'</span></td>'
    + '<td style="text-align:center"><input class="tick" type="checkbox" data-approve="'+id+'"'
      + (r.approved?' checked':'') + (canTick?'':' disabled')
      + ' title="'+(canTick?'Approve this item':'Not ready for approval yet')+'"></td>'
    + '</tr>'
    + '<tr class="noterow" id="note-'+id+'" hidden><td colspan="9"><div class="notewrap">'
      + '<label>Your notes on this item</label>'
      + '<textarea class="note" data-notefor="'+id+'" placeholder="Anything you want changed before we publish?">'
      + esc(r.client_notes||'')+'</textarea></div></td></tr>';

  if (staff) {
    const brief = (INTERNAL[r.id]||{}).brief;
    out += '<tr class="noterow" id="links-'+id+'" hidden><td colspan="9"><div class="linkwrap">'
         + '<label>Google Doc</label>'
         + '<input class="lin" data-doc="'+id+'" value="'+esc(r.doc_url||'')+'" placeholder="https://docs.google.com/…">'
         + '<label>Live URL</label>'
         + '<input class="lin" data-live="'+id+'" value="'+esc(r.live_url||'')+'" placeholder="https://…">'
         + '<button class="btn" type="button" data-savelinks="'+id+'">Save</button>'
         + (brief ? '<div class="brief"><b>Brief</b>'+esc(brief).replace(/\n/g,'<br>')+'</div>' : '')
         + '</div></td></tr>';
  }
  return out;
}

function wireMonthBrief(el, t){
  el.querySelectorAll('[data-note]').forEach(b => b.addEventListener('click', () => {
    const row = $('note-'+b.dataset.note); row.hidden = !row.hidden;
  }));
  el.querySelectorAll('[data-links]').forEach(b => b.addEventListener('click', () => {
    const row = $('links-'+b.dataset.links); row.hidden = !row.hidden;
  }));

  el.querySelectorAll('[data-approve]').forEach(cb => cb.addEventListener('change', async () => {
    const id = cb.dataset.approve;
    cb.disabled = true; badge('Saving…');
    const { error } = await sb.from('ch_items').update({ approved: cb.checked }).eq('id', id);
    cb.disabled = false;
    if (error) { cb.checked = !cb.checked; badge('Could not save that.','err'); return; }
    const it = ITEMS.find(r => r.id === id);
    it.approved = cb.checked;
    it.client_status = cb.checked ? 'approved' : 'for_approval';
    badge('Saved','ok');
    refreshMonth(t);
  }));

  el.querySelectorAll('[data-notefor]').forEach(ta => {
    let timer;
    ta.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        badge('Saving…');
        const { error } = await sb.from('ch_items')
          .update({ client_notes: ta.value || null }).eq('id', ta.dataset.notefor);
        if (error) { badge('Could not save that note.','err'); return; }
        ITEMS.find(r => r.id === ta.dataset.notefor).client_notes = ta.value || null;
        badge('Saved','ok');
      }, 700);
    });
  });

  // Staff only. The client login has no UPDATE grant on these two columns, so
  // this goes through a SECURITY DEFINER function that re-checks ch_is_internal().
  el.querySelectorAll('[data-savelinks]').forEach(b => b.addEventListener('click', async () => {
    const id  = b.dataset.savelinks;
    const doc = el.querySelector('[data-doc="'+id+'"]').value.trim();
    const liv = el.querySelector('[data-live="'+id+'"]').value.trim();
    b.disabled = true; badge('Saving…');
    const { error } = await sb.rpc('ch_set_item_links',
      { p_item_id: id, p_doc_url: doc || null, p_live_url: liv || null });
    b.disabled = false;
    if (error) { badge('Could not save those links.','err'); return; }
    const it = ITEMS.find(r => r.id === id);
    it.doc_url = doc || null; it.live_url = liv || null;
    badge('Saved','ok');
    refreshMonth(t);
  }));
}

/* Re-render a month tab without losing whichever note or link rows are open. */
function refreshMonth(t){
  const el = $('panel-'+cssId(t.key));
  if (!el) return;
  const open = [...el.querySelectorAll('.noterow')].filter(r => !r.hidden).map(r => r.id);
  renderPanel(t);
  open.forEach(id => { const r = $(id); if (r) r.hidden = false; });
}

/* ---------------- keywords + AI search (client) ---------------- */
function posCell(p, prev){
  if (p === null || p === undefined)
    return '<span class="pos none" title="Not in the top 100">not ranking</span>';
  const band = p <= 3 ? 'top3' : (p <= 10 ? 'p1' : (p <= 30 ? 'p2' : 'deep'));
  let move = '';
  if (prev !== null && prev !== undefined && prev !== p) {
    const d = prev - p;
    move = '<span class="mv '+(d>0?'up':'down')+'">'+(d>0?'▲':'▼')+Math.abs(d)+'</span>';
  }
  return '<span class="pos '+band+'">'+p+'</span>'+move;
}

function keywordsMarkup(){
  let out = '';

  if (KEYWORDS.length) {
    const ranking = KEYWORDS.filter(k => k.position !== null && k.position !== undefined);
    const p1 = ranking.filter(k => k.position <= 10).length;
    const p2 = ranking.filter(k => k.position > 10 && k.position <= 30).length;
    const totalVol = KEYWORDS.reduce((a,k) => a + (k.volume||0), 0);
    out += '<div class="statrow">'
         + '<div class="stat"><div class="big">'+KEYWORDS.length+'</div><div class="lbl">Keywords we are targeting</div></div>'
         + '<div class="stat"><div class="big">'+totalVol.toLocaleString()+'</div><div class="lbl">Combined monthly searches</div></div>'
         + '<div class="stat"><div class="big">'+p1+'</div><div class="lbl">Already on page 1</div></div>'
         + '<div class="stat"><div class="big">'+p2+'</div><div class="lbl">On page 2 or 3, within reach</div></div>'
         + '</div>';

    out += '<p class="intro">Every keyword below has real, measured search volume and maps to a service '
         + 'you actually offer. <b>Position</b> is where your site sits in Google right now, checked '
         + 'against the whole top 100. It updates as we work, so this doubles as your scoreboard.</p>';

    const groups = [...new Set(KEYWORDS.map(k => k.kw_group))];
    for (const g of groups) {
      const gk = KEYWORDS.filter(k => k.kw_group === g);
      const gv = gk.reduce((a,k) => a + (k.volume||0), 0);
      let rows = '';
      for (const k of gk) {
        rows += '<tr><td class="kwc">'+esc(k.keyword)+'</td>'
              + '<td><span class="badge '+({service:'b-svc',location:'b-loc',blog:'b-blog',brand:'b-power'}[k.kw_type]||'b-svc')+'">'
                + esc(k.kw_type)+'</span></td>'
              + '<td class="num">'+volCell(k.volume)+'</td>'
              + '<td class="num">'+kdPill(k.difficulty)+'</td>'
              + '<td class="num">'+(k.cpc ? '$'+Number(k.cpc).toFixed(2) : '—')+'</td>'
              + '<td class="num">'+posCell(k.position, k.prev_position)+'</td></tr>';
      }
      out += '<div class="monthgroup"><div class="mg-head">'
           + '<span class="mt">'+esc(g)+'</span>'
           + '<span class="mm">'+gk.length+' keywords &middot; '+gv.toLocaleString()+' searches/mo</span></div>'
           + '<div class="scroll"><table class="mini"><thead><tr>'
           + '<th>Keyword</th><th>Type</th><th>Searches/mo</th><th>Difficulty</th><th>Ads cost/click</th>'
           + '<th>Your position</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    }
  }

  if (PROMPTS.length) {
    const visible = PROMPTS.filter(p => p.status !== 'dark').length;
    out += '<h3 class="subhead"><span class="sn">AI</span>AI search prompts we are going after</h3>'
         + '<p>Search is moving into ChatGPT, Gemini, Perplexity, Claude and Grok. These are the real '
         + 'questions people ask about plumbing in your area. We track whether you get named in the answer.</p>'
         + '<div class="statrow">'
         + '<div class="stat"><div class="big">'+visible+' / '+PROMPTS.length+'</div><div class="lbl">Prompts you currently appear on</div></div>'
         + '</div>';
    let rows = '';
    for (const p of PROMPTS) {
      rows += '<tr><td class="asset">'+esc(p.prompt)+'</td>'
            + '<td>'+esc(p.topic)+'</td>'
            + '<td><span class="sp '+(p.status==='visible'?'approved':(p.status==='partial'?'for_approval':'started'))+'">'
              + esc(PROMPT_LABEL[p.status]||p.status)+'</span></td>'
            + '<td class="note">'+esc(p.engines||'')+'</td></tr>';
    }
    out += '<div class="scroll"><table class="mini"><thead><tr>'
         + '<th>Prompt</th><th>Topic</th><th>Where you stand</th><th>Engines</th>'
         + '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  return out || '<p class="empty">No keywords loaded yet.</p>';
}

/* ---------------- progress (internal) ---------------- */
function progressMarkup(){
  if (!ITEMS.length) return '<p class="empty">No items scheduled yet.</p>';
  const opts = id => INTERNAL_STATUS.map(([v,l]) =>
    '<option value="'+v+'"'+((INTERNAL[id]||{}).internal_status===v?' selected':'')+'>'+l+'</option>').join('');
  const staffOpts = id => '<option value="">Unassigned</option>' + STAFF.map(s =>
    '<option value="'+s.id+'"'+((INTERNAL[id]||{}).assigned_to===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('');

  const months = [...new Set(ITEMS.map(r => r.month_key))].sort();
  let out = '<div class="callout">Marking an item <b>Done</b> here flips it to <b>For approval</b> on the '
          + 'client calendar. The client never sees these stages.</div>';
  for (const mk of months) {
    const mr = ITEMS.filter(r => r.month_key === mk);
    const done = mr.filter(r => (INTERNAL[r.id]||{}).internal_status === 'done').length;
    const pct = Math.round(done / mr.length * 100);
    const rag = pct === 100 ? 'green' : (pct >= 40 ? 'amber' : 'red');
    let body = '';
    for (const r of mr) {
      const id = esc(r.id);
      body += '<tr><td class="date">'+esc(fmtDate(r.publish_date))+'</td>'
        + '<td><span class="badge '+(TYPE_BADGE[r.stream]||'b-blog')+'">'
          + esc(TYPE_LABEL[r.stream]||r.stream)+'</span></td>'
        + '<td class="title">'+esc(r.title)+'</td>'
        + '<td><select data-assign="'+id+'">'+staffOpts(r.id)+'</select></td>'
        + '<td><select data-status="'+id+'">'+opts(r.id)+'</select></td>'
        + '<td class="lnk">'
          + (r.doc_url  ? '<a class="dl" href="'+esc(r.doc_url)+'" target="_blank" rel="noopener">Draft</a>'
                        : '<span class="dl-none">—</span>')
          + ' '
          + (r.live_url ? '<a class="dl live" href="'+esc(r.live_url)+'" target="_blank" rel="noopener">Live</a>'
                        : '<span class="dl-none">—</span>')
          + '</td>'
        + '<td><span class="sp '+esc(r.client_status)+'">'
          + esc(CLIENT_STATUS[r.client_status]||r.client_status)+'</span></td>'
        + '<td class="date">'+esc(((INTERNAL[r.id]||{}).due_date)||'—')+'</td></tr>';
    }
    out += '<div class="monthgroup"><div class="mg-head">'
         + '<span class="mt">'+esc(monthLabel(mk))+'</span>'
         + '<span class="rag '+rag+'"><i></i>'+done+' of '+mr.length+' done</span>'
         + '<span class="mm">'+pct+'%</span></div>'
         + '<div class="mg-bar"><i style="width:'+pct+'%"></i></div>'
         + '<div class="scroll"><table class="mini caltable"><thead><tr>'
         + '<th>Date</th><th>Type</th><th>Item</th><th>Assigned to</th><th>Internal status</th>'
         + '<th>Links</th><th>Client sees</th><th>Due</th>'
         + '</tr></thead><tbody>'+body+'</tbody></table></div></div>';
  }

  // AI prompts we are tracking, so the team sees GEO progress next to the content.
  if (PROMPTS.length) {
    const visible = PROMPTS.filter(p => p.status === 'visible').length;
    const partial = PROMPTS.filter(p => p.status === 'partial').length;
    const pct = Math.round((visible + partial * 0.5) / PROMPTS.length * 100);
    const rag = pct >= 60 ? 'green' : (pct >= 25 ? 'amber' : 'red');
    let rows = '';
    for (const p of PROMPTS) {
      rows += '<tr><td class="asset">'+esc(p.prompt)+'</td>'
            + '<td>'+esc(p.topic)+'</td>'
            + '<td><span class="sp '+(p.status==='visible'?'approved':(p.status==='partial'?'for_approval':'started'))+'">'
              + esc(PROMPT_LABEL[p.status]||p.status)+'</span></td>'
            + '<td class="note">'+esc(p.engines||'')+'</td>'
            + '<td class="note">'+esc(p.notes||'')+'</td>'
            + '<td class="date">'+esc(p.last_checked||'—')+'</td></tr>';
    }
    out += '<div class="monthgroup"><div class="mg-head">'
         + '<span class="mt">AI search prompts</span>'
         + '<span class="rag '+rag+'"><i></i>'+visible+' showing, '+partial+' partial, '
         + (PROMPTS.length-visible-partial)+' dark</span>'
         + '<span class="mm">'+pct+'% coverage</span></div>'
         + '<div class="mg-bar"><i style="width:'+pct+'%"></i></div>'
         + '<div class="scroll"><table class="mini caltable"><thead><tr>'
         + '<th>Prompt</th><th>Topic</th><th>Status</th><th>Engines</th><th>Note</th><th>Checked</th>'
         + '</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }
  return out;
}

function wireProgress(el){
  el.querySelectorAll('[data-status]').forEach(sel => sel.addEventListener('change', async () => {
    const id = sel.dataset.status;
    badge('Saving…');
    const { error } = await sb.from('ch_items_internal')
      .upsert({ item_id: id, internal_status: sel.value }, { onConflict: 'item_id' });
    if (error) { badge('Could not save that status.','err'); return; }
    INTERNAL[id] = Object.assign({}, INTERNAL[id], { item_id:id, internal_status: sel.value });
    const { data } = await sb.from('ch_items').select('*').eq('id', id).maybeSingle();
    if (data) { const i = ITEMS.findIndex(r => r.id===id); if (i>=0) ITEMS[i] = data; }
    badge('Saved','ok');
    // TABLIST, not CFG.tabs -- CFG.tabs has no number on it, and head() prints one.
    const t = TABLIST.find(x => x.key === 'progress');
    if (t) { renderPanel(t); wireProgress($('panel-progress')); }
  }));
  el.querySelectorAll('[data-assign]').forEach(sel => sel.addEventListener('change', async () => {
    const id = sel.dataset.assign;
    badge('Saving…');
    const { error } = await sb.from('ch_items_internal')
      .upsert({ item_id: id, assigned_to: sel.value || null }, { onConflict: 'item_id' });
    if (error) { badge('Could not save that.','err'); return; }
    INTERNAL[id] = Object.assign({}, INTERNAL[id], { item_id:id, assigned_to: sel.value || null });
    badge('Saved','ok');
  }));
}

boot();
</script>
